name: Preview Japan 2023

on:
  push:
    branches:
      - muyangamigo-japan-2023-travel-log
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: japan-2023-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Build and deploy branch preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies with Next.js 16.3.0
        working-directory: site
        run: |
          rm -f package-lock.json
          npm install --package-lock=false --no-save --no-audit --no-fund next@16.3.0

      - name: Make Japan 2023 public in preview only
        run: "sed -i 's/private: true/private: false/' site/src/content/trips/japan-2023/meta.ts"

      - name: Build preview
        working-directory: site
        env:
          NEXT_PUBLIC_MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          NEXT_PUBLIC_MICROSOFT_REDIRECT_URI: https://muyangamigo.github.io/travel-log/auth/callback/
          TRAVEL_LOG_AUTH_API_URL: ${{ vars.TRAVEL_LOG_AUTH_API_URL }}
          TRAVEL_LOG_PRIVATE_PASSWORD: ${{ secrets.TRAVEL_LOG_PRIVATE_PASSWORD }}
        run: npm run build

      - name: Deploy branch preview
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site/out
          output_location: ""
          skip_app_build: true
          production_branch: main
          deployment_environment: japan-2023

      - name: Publish preview URL
        run: printf '### Preview URL\n%s\n' '${{ steps.deploy.outputs.static_web_app_url }}' >> "$GITHUB_STEP_SUMMARY"
