name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  auth-api-test:
    name: Test authentication API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: api
        run: npm test

  auth-api-deploy:
    name: Deploy authentication API
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci --no-audit --no-fund

      - name: Deploy function package
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          package: api
          publish-profile: ${{ secrets.AZURE_FUNCTION_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: Check authentication API
        env:
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          TRAVEL_LOG_AUTH_API_URL: ${{ vars.TRAVEL_LOG_AUTH_API_URL }}
          TRAVEL_LOG_AUTH_ORIGIN: https://muyangamigo.github.io
          TRAVEL_LOG_PRIVATE_PASSCODE: ${{ secrets.TRAVEL_LOG_PRIVATE_PASSCODE }}
          TRAVEL_LOG_PRIVATE_PASSWORD: ${{ secrets.TRAVEL_LOG_PRIVATE_PASSWORD }}
        run: node scripts/check-auth-api.mjs

      - name: Check editor API configuration
        env:
          TRAVEL_LOG_AUTH_API_URL: ${{ vars.TRAVEL_LOG_AUTH_API_URL }}
          TRAVEL_LOG_AUTH_ORIGIN: https://muyangamigo.github.io
        run: node scripts/check-editor-api.mjs

  build:
    name: Build
    needs: auth-api-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: site
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build Next.js site
        working-directory: site
        env:
          NEXT_PUBLIC_BASE_PATH: /travel-log
          NEXT_PUBLIC_MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          NEXT_PUBLIC_MICROSOFT_REDIRECT_URI: https://muyangamigo.github.io/travel-log/auth/callback/
          TRAVEL_LOG_AUTH_API_URL: ${{ vars.TRAVEL_LOG_AUTH_API_URL }}
          TRAVEL_LOG_PRIVATE_PASSWORD: ${{ secrets.TRAVEL_LOG_PRIVATE_PASSWORD }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/out

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: auth-api-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
